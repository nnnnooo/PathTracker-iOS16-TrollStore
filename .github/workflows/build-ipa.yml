name: Build iOS 16 TrollStore IPA

on:
  push:
    branches: [ main ]
    paths:
      - 'Sources/**'
      - 'Resources/**'
      - 'project.yml'
      - 'build_local_ipa.sh'
      - '.github/workflows/build-ipa.yml'
  workflow_dispatch:

concurrency:
  group: build-ios16-trollstore-ipa
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Unsigned Release App (iOS 16.0+)
        run: |
          xcodebuild \
            -project Waytrace16.xcodeproj \
            -scheme Waytrace16 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA for TrollStore
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Waytrace16.app Payload/
          zip -qr Waytrace-iOS16-TrollStore.ipa Payload
          ls -lh Waytrace-iOS16-TrollStore.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Waytrace-iOS16-TrollStore
          path: Waytrace-iOS16-TrollStore.ipa
          retention-days: 30

name: Waytrace16
options:
  bundleIdPrefix: com.waytrace
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"

targets:
  Waytrace16:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
        excludes:
          - Info.plist
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.waytrace.ios16
        PRODUCT_NAME: Waytrace16
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "261126"
        SWIFT_VERSION: "5.9"
        INFOPLIST_FILE: Sources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        OTHER_LDFLAGS:
          - "-lsqlite3"
